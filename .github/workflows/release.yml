name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "1"

jobs:
  build-linux-binaries:
    name: Build ${{ matrix.artifact }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            artifact: sparklytics-linux-amd64
          - platform: linux/arm64
            artifact: sparklytics-linux-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build binary rootfs
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          outputs: type=local,dest=dist/rootfs
          build-args: |
            CARGO_BUILD_JOBS=1

      - name: Package artifact
        shell: bash
        run: |
          mkdir -p dist/upload
          cp dist/rootfs/sparklytics "dist/upload/${{ matrix.artifact }}"
          chmod +x "dist/upload/${{ matrix.artifact }}"
          shasum -a 256 "dist/upload/${{ matrix.artifact }}" > "dist/upload/${{ matrix.artifact }}.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/upload/*

  build-macos-binaries:
    name: Build ${{ matrix.target }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: sparklytics-darwin-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: sparklytics-darwin-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Build dashboard for embedded release binary
        working-directory: dashboard
        run: |
          npm ci
          npm run build

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package artifact
        shell: bash
        run: |
          mkdir -p dist
          BIN="target/${{ matrix.target }}/release/sparklytics"
          cp "$BIN" "dist/${{ matrix.artifact }}"
          chmod +x "dist/${{ matrix.artifact }}"
          shasum -a 256 "dist/${{ matrix.artifact }}" > "dist/${{ matrix.artifact }}.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/sparklytics/sparklytics
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          # Keep image manifests aligned with Linux binary artifacts (amd64 + arm64).
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CARGO_BUILD_JOBS=1

  github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-linux-binaries, build-macos-binaries, docker]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Flatten artifacts
        run: |
          mkdir -p dist
          find release-assets -maxdepth 3 -type f -exec cp {} dist/ \;

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
