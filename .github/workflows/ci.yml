name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "2"
  RUST_LOG: "sparklytics=warn"

jobs:
  rust:
    name: Rust — fmt / clippy / test / audit / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Public repo boundary check
        run: node scripts/check-public-boundary.mjs

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo check
        run: cargo check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test

      - name: cargo audit
        run: |
          cargo install cargo-audit --quiet
          cargo audit

      - name: Setup Node 20 for release dashboard
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Build dashboard for embedded release binary
        working-directory: dashboard
        run: |
          npm ci
          npm run build

      - name: cargo build --release
        run: cargo build --release

  dashboard:
    name: Dashboard — lint / type-check / build / smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run type-check

      - run: npm run build

      - run: npm run test:tracking-script

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: First launch onboarding smoke
        run: npm run test:e2e -- first-launch-onboarding.spec.ts

      - name: Release smoke
        run: npm run test:release-smoke

      - name: Bundle size check (largest chunk < 150KB gzipped)
        run: |
          LARGEST=$(for f in out/_next/static/chunks/*.js; do
            [ -f "$f" ] && gzip -c "$f" | wc -c
          done | sort -rn | head -1)
          LARGEST="${LARGEST:-0}"
          echo "Largest gzipped chunk: ${LARGEST} bytes"
          if [ "${LARGEST}" -gt 153600 ]; then
            echo "ERROR: Bundle too large: ${LARGEST} bytes gzipped (limit 153600)"
            exit 1
          fi

  docker:
    name: Docker — amd64 build (no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build amd64 image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: false
          tags: sparklytics/sparklytics:ci
          build-args: |
            CARGO_BUILD_JOBS=2
