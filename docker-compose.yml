services:
  sparklytics:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        # DuckDB's bundled C++ build can exceed small VPS memory when Cargo
        # fans out. Keep the default conservative; set CARGO_BUILD_JOBS=4 on
        # larger builders to speed up source builds.
        CARGO_BUILD_JOBS: ${CARGO_BUILD_JOBS:-1}
    image: sparklytics/sparklytics:local
    ports:
      - "3000:3000"
    volumes:
      - sparklytics-data:/data
    environment:
      # Auth mode: "local" (recommended), "password", or "none"
      - SPARKLYTICS_AUTH=local
      # First-boot bootstrap password. If omitted, Sparklytics falls back to:
      #   sparklytics
      # and then forces an immediate password rotation after first login.
      # Set this explicitly in production.
      - SPARKLYTICS_BOOTSTRAP_PASSWORD=replace-this-bootstrap-password

      # Local source-build compose serves plain HTTP on localhost.
      # Use docker-compose.caddy.yml or set this to true behind real HTTPS.
      - SPARKLYTICS_HTTPS=false

      # Public origin used in onboarding snippets and share links.
      # Use your real HTTPS origin in production.
      - SPARKLYTICS_PUBLIC_URL=http://localhost:3000
      # Optional canonical tracker base. Set this when serving the snippet through
      # a same-origin proxy path such as https://example.com/_sl
      # - SPARKLYTICS_TRACKING_PUBLIC_BASE=https://example.com/_sl

      # DuckDB query memory. Raise to 2GB–8GB on a larger VPS.
      - SPARKLYTICS_DUCKDB_MEMORY=1GB

      # Trust reverse proxies before accepting X-Forwarded-For.
      # Example Docker bridge CIDR — replace for your environment:
      # - SPARKLYTICS_TRUSTED_PROXIES=172.18.0.0/16

      # Restrict which origins can query the analytics API from a browser.
      # Uncomment and set to your site(s):
      # - SPARKLYTICS_CORS_ORIGINS=https://yoursite.com,https://www.yoursite.com
    restart: unless-stopped

volumes:
  sparklytics-data:
